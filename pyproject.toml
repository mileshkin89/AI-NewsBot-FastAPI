[project]
name = "ai-newsbot-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.24.0",
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "fastapi>=0.128.0",
    "openai>=2.17.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.11.0",
    "redis>=7.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "telethon>=1.42.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.22",
    "argon2-cffi>=25.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]
filterwarnings = [
    # passlib accesses argon2.__version__ (deprecated in argon2-cffi)
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
    # SQLAlchemy session/transaction lifecycle in test rollback
    "ignore:transaction already deassociated:sqlalchemy.exc.SAWarning",
    # Test env often uses short SECRET_KEY; production should use 32+ bytes (RFC 7518)
    "ignore:The HMAC key is:Warning",
]
